[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dance-code-belle"
version = "0.1.0"
description = "Offline-first Python controller for the Dance Code Belle doll"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Thanh Bui"}]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22,<4"]
ui = ["streamlit>=1.50,<2", "bleak>=0.22,<4"]

[project.scripts]
belle = "dance_code_belle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dance_code_belle = ["catalog.json", "py.typed"]
